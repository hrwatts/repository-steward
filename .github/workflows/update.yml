name: Repository Steward Pilot Scan

on:
  schedule:
    - cron: "17 14 * * *"
    - cron: "43 22 * * *"
  workflow_dispatch:

concurrency:
  group: repository-steward-pilot-scan
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Locate previous persisted audit artifact
        id: previous_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact="$(
            gh api \
              --method GET \
              repos/${{ github.repository }}/actions/artifacts \
              -f name=repository-steward-state \
              -F per_page=100 \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0] // {}'
          )"
          echo "artifact_id=$(jq -r '.id // empty' <<<"$artifact")" >> "$GITHUB_OUTPUT"
          echo "run_id=$(jq -r '.workflow_run.id // empty' <<<"$artifact")" >> "$GITHUB_OUTPUT"

      - name: Restore persisted audit state
        if: steps.previous_state.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-steward-state
          path: .data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.run_id }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dry pilot inspection
        id: inspect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_ISSUE_REPO: ${{ github.repository }}
          DASHBOARD_ISSUE_NUMBER: ${{ vars.REPOSITORY_STEWARD_DASHBOARD_ISSUE_NUMBER }}
          REPOSITORY_STEWARD_DRY_RUN: "true"
          REPOSITORY_STEWARD_MUTATIONS_ENABLED: "false"
          REPOSITORY_STEWARD_ARTIFACT_NAME: repository-steward-run
        run: npm run inspect:pilot

      - name: Read run metadata
        id: runmeta
        run: |
          echo "run_id=$(cat artifacts/runs/latest-run-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-steward-run
          path: artifacts/runs
          retention-days: 90

      - name: Sync dashboard issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_ISSUE_REPO: ${{ github.repository }}
          DASHBOARD_ISSUE_NUMBER: ${{ vars.REPOSITORY_STEWARD_DASHBOARD_ISSUE_NUMBER }}
          REPOSITORY_STEWARD_SYNC_RUN_ID: ${{ steps.runmeta.outputs.run_id }}
        run: npm run sync:dashboard

      - name: Upload persisted audit state
        if: always() && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-steward-state
          path: .data/repository-steward.db
          retention-days: 90
