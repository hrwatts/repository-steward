name: Maintenance Validation

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      clean-install-command:
        required: true
        type: string
      validation-command:
        required: true
        type: string
      regeneration-command:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  maintenance-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clean install
        env:
          VALIDATION_COMMAND: ${{ inputs.clean-install-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Validate
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Regenerate deterministic outputs
        if: inputs.regeneration-command != ''
        env:
          VALIDATION_COMMAND: ${{ inputs.regeneration-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Verify idempotence and clean tree
        shell: bash
        run: git diff --exit-code -- .
