name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish multi-platform image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Generate SPDX SBOM from published image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: repository-steward-${{ github.ref_name }}.spdx.json
          output-file: repository-steward-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest image SBOM
        id: sbom_attestation
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: repository-steward-${{ github.ref_name }}.spdx.json
          push-to-registry: true

      - name: Attest image build provenance
        id: provenance_attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Name attestation bundles for release assets
        shell: bash
        run: |
          cp "${{ steps.sbom_attestation.outputs.bundle-path }}" \
            "repository-steward-${{ github.ref_name }}.sbom-attestation.intoto.jsonl"
          cp "${{ steps.provenance_attestation.outputs.bundle-path }}" \
            "repository-steward-${{ github.ref_name }}.provenance.intoto.jsonl"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            repository-steward-${{ github.ref_name }}.spdx.json
            repository-steward-${{ github.ref_name }}.sbom-attestation.intoto.jsonl
            repository-steward-${{ github.ref_name }}.provenance.intoto.jsonl
          body: |
            Container image: `${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}`

            This release includes an SPDX JSON SBOM plus GitHub artifact
            attestation bundles for the image SBOM and SLSA build provenance.
