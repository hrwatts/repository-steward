name: Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
      working-directory:
        required: false
        type: string
        default: "."
      install-command:
        required: false
        type: string
        default: "python -m pip install -e ."
      lint-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: "python -m pytest"

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project
        env:
          VALIDATION_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Lint
        if: inputs.lint-command != ''
        env:
          VALIDATION_COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Test
        env:
          VALIDATION_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"
